<figure class="fig"><svg viewBox="0 0 900 214" role="img" aria-label="When delegation saves tokens versus when it costs more"><rect x="10" y="14" width="430" height="40" rx="12" fill="#12915a" stroke="#12915a" stroke-width="2"/><text x="225.0" y="39.2" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Delegation pays off when...</text><rect x="460" y="14" width="430" height="40" rx="12" fill="#c21c7a" stroke="#c21c7a" stroke-width="2"/><text x="675.0" y="39.2" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Delegation costs more when...</text><rect x="10" y="66" width="430" height="38" rx="12" fill="#dff5ea" stroke="#12915a" stroke-width="2"/><text x="225.0" y="89.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17152a">raw output volume &gt;&gt; useful conclusion</text><rect x="10" y="112" width="430" height="38" rx="12" fill="#dff5ea" stroke="#12915a" stroke-width="2"/><text x="225.0" y="135.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17152a">broad exploration, logs, research</text><rect x="10" y="158" width="430" height="38" rx="12" fill="#dff5ea" stroke="#12915a" stroke-width="2"/><text x="225.0" y="181.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17152a">independent investigations</text><rect x="460" y="66" width="430" height="38" rx="12" fill="#ffe6f3" stroke="#c21c7a" stroke-width="2"/><text x="675.0" y="89.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17152a">one-line fix or 1-2 tool calls</text><rect x="460" y="112" width="430" height="38" rx="12" fill="#ffe6f3" stroke="#c21c7a" stroke-width="2"/><text x="675.0" y="135.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17152a">brief must restate the whole conversation</text><rect x="460" y="158" width="430" height="38" rx="12" fill="#ffe6f3" stroke="#c21c7a" stroke-width="2"/><text x="675.0" y="181.7" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17152a">several a
