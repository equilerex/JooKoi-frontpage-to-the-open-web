="170.2" text-anchor="middle" font-size="13" font-weight="400" fill="#17152a">latency does not matter</text><rect x="604" y="126" width="283" height="58" rx="12" fill="#dff5ea" stroke="#12915a" stroke-width="2"/><text x="745.5" y="150.2" text-anchor="middle" font-size="15" font-weight="700" fill="#17152a">Idle hardware</text><text x="745.5" y="170.2" text-anchor="middle" font-size="13" font-weight="400" fill="#17152a">overnight bulk work</text></svg><figcaption>Reasons, not a general replacement.</figcaption></figure>
