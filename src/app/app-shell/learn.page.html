<joo-breadcrumb-trail [crumbs]="crumbs" />

<joo-readout-panel label="Learn" led="cyan">
  <span panelHead class="panel-meta">{{ treeNodes.length }} sections</span>
  <joo-topic-tree
    [nodes]="treeNodes"
    ariaLabel="Learn topics"
    (nodeActivate)="onNodeActivate($event)"
  />
</joo-readout-panel>
