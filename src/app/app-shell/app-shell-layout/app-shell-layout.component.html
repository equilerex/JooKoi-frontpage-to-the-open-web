<joo-horizon-backdrop />
<joo-heads-up-display-header
  [navItems]="headerNavItems()"
  [statusText]="statusText()"
  [console]="true"
  (searchSubmitted)="onHeaderSearch($event)"
/>
<main
  id="main-content"
  class="page"
  [class.page--wide]="isLibraryWide()"
  [class.page--motion]="shellMotionReady()"
>
  <router-outlet />
</main>
<footer class="shell-footer" role="contentinfo">
  <div class="shell-footer__inner">
    <span class="shell-footer__meta">JooKoi · Front page to the open web</span>
    <nav class="shell-footer__nav" aria-label="Footer">
      <a
        class="shell-footer__link"
        href="https://github.com/equilerex/JooKoi-developer-stack"
        target="_blank"
        rel="noopener"
      >
        Developer Stack ↗
      </a>
      <a
        class="shell-footer__link"
        href="https://github.com/equilerex/JooKoi-frontpage-to-the-open-web"
        target="_blank"
        rel="noopener"
      >
        Source ↗
      </a>
    </nav>
  </div>
</footer>
<joo-mobile-bottom-dock [navItems]="dockNavItems()" />
