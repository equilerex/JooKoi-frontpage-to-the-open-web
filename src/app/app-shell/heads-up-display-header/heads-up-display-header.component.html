<div class="hud__inner">
  <a class="hud__brand" href="/">
    <span class="hud__mark" aria-hidden="true"></span>
    <joo-logotype size="sm">Open <b>Web</b></joo-logotype>
  </a>
  @if (console()) {
    <div class="hud__search">
      <joo-console-input
        size="compact"
        placeholder="Search the open web"
        [(value)]="searchQuery"
        (submitted)="searchSubmitted.emit($event)"
      />
    </div>
  }
  <nav class="hud__nav" aria-label="Primary">
    @for (item of navItems(); track item.href) {
      <joo-hardware-key as="anchor" size="sm" [href]="item.href" [current]="item.active ?? false">
        <joo-status-light color="cyan" [on]="item.active ?? false" />
        {{ item.label }}
      </joo-hardware-key>
    }
  </nav>
  @if (statusText()) {
    <div class="hud__status" aria-hidden="true">
      <joo-status-light color="green" [on]="true" [blink]="true" />
      {{ statusText() }}
    </div>
  }
</div>
